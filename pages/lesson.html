<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1116" />
  <title>درس — منصة تقدّم</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a href="../dashboard.html" class="brand">
        <span class="brand-logo">ت</span>
        <span>الدرس<small id="headerCrumb">—</small></span>
      </a>
      <div class="row">
        <button class="icon-btn" data-theme-toggle>🌙</button>
        <a href="profile.html" class="icon-btn">👤</a>
      </div>
    </div>
  </header>

  <main class="container section" id="lessonRoot">

    <!-- Breadcrumb -->
    <div class="breadcrumb mb-2">
      <a href="subjects.html">المنهج</a>
      <span>›</span>
      <span id="crumbSubject">—</span>
      <span>›</span>
      <span id="crumbUnit">—</span>
    </div>

    <!-- بطاقة الدرس -->
    <section class="card lesson-card mb-3">
      <div class="row-between wrap" style="gap:8px">
        <span class="badge" id="statusBadge">—</span>
        <span class="tiny" id="lessonMeta">—</span>
      </div>

      <h1 class="lesson-title" id="lessonTitle">—</h1>

      <div class="lesson-actions mt-3">
        <button class="btn ghost block" id="btnInProgress">◐ تحديد كـ منتصف الدرس</button>
        <button class="btn primary block" id="btnDone">✓ تم إنجاز الدرس</button>
        <button class="btn danger block hidden" id="btnUndo">↺ إلغاء الإكمال</button>
      </div>
    </section>

    <!-- التنقل بين الدروس -->
    <section class="lesson-nav">
      <button class="btn ghost" id="btnPrev">← الدرس السابق</button>
      <a href="subjects.html" class="btn ghost">📚 المنهج</a>
      <button class="btn ghost" id="btnNext">الدرس التالي →</button>
    </section>

  </main>

  <nav class="bottom-nav">
    <a href="../dashboard.html" data-nav><span class="nav-ico">🏠</span>الرئيسية</a>
    <a href="subjects.html" data-nav><span class="nav-ico">📚</span>المنهج</a>
    <a href="stats.html" data-nav><span class="nav-ico">📊</span>الإحصائيات</a>
    <a href="focus.html" data-nav><span class="nav-ico">🧠</span>تركيز</a>
    <a href="profile.html" data-nav><span class="nav-ico">👤</span>حسابي</a>
  </nav>

  <script src="../data.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/curriculum.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/app.js"></script>

  <script>
    (function () {
      const user = Auth.requireAuth();
      if (!user) return;

      const params  = new URLSearchParams(location.search);
      const lessonId = params.get('id');
      const lesson  = lessonId ? Curriculum.getLesson(lessonId) : null;

      if (!lesson) {
        UI.el('#lessonRoot').innerHTML = `
          <div class="card center">
            <h2>لم يتم العثور على الدرس</h2>
            <p class="muted">تأكد أن الرابط يحتوي على معرّف درس صحيح.</p>
            <a href="subjects.html" class="btn primary mt-2">عودة إلى المنهج</a>
          </div>`;
        return;
      }

      // عنوان التبويب
      document.title = `${lesson.lesson_name} — منصة تقدّم`;

      /* ---------- عرض بيانات الدرس ---------- */
      UI.el('#headerCrumb').textContent  = lesson.subject_name;
      UI.el('#crumbSubject').textContent = lesson.subject_name;
      UI.el('#crumbUnit').textContent    = `الوحدة ${lesson.unit_number}: ${lesson.unit_name}`;
      UI.el('#lessonTitle').textContent  = lesson.lesson_name;
      UI.el('#lessonMeta').textContent   =
        `الدرس ${lesson.lesson_number} من الوحدة ${lesson.unit_number}`;

      /* ---------- تحديث الواجهة حسب الحالة ---------- */
      const badge = UI.el('#statusBadge');
      const btnDone = UI.el('#btnDone');
      const btnInp  = UI.el('#btnInProgress');
      const btnUndo = UI.el('#btnUndo');

      const render = () => {
        const st = Progress.getStatus(lesson.lesson_id);

        badge.className = 'badge ' + (
          st === 'done' ? 'success' :
          st === 'inprogress' ? 'warning' : ''
        );
        badge.textContent = Progress.STATUS_LABEL[st];

        // أزرار
        btnDone.classList.toggle('hidden', st === 'done');
        btnInp.classList.toggle('hidden',  st === 'done' || st === 'inprogress');
        btnUndo.classList.toggle('hidden', st !== 'done');
      };

      /* ---------- الأحداث ---------- */
      btnInp.addEventListener('click', () => {
        Progress.markInProgress(lesson.lesson_id);
        UI.toast('تم وضع الدرس في منتصف الطريق ◐', 'info');
        render();
      });

      btnDone.addEventListener('click', async () => {
        const ok = await UI.confirm({
          title: 'تأكيد الإنجاز',
          message: 'هل أنت متأكد أنك أنجزت هذا الدرس؟',
          okText: 'نعم، أنجزته',
          cancelText: 'إلغاء'
        });
        if (!ok) return;
        const added = Progress.checkAchievements();
        Progress.markDone(lesson.lesson_id);
        UI.toast('تم إكمال الدرس ✓', 'success');
        render();

        const newAch = Progress.listAchievements().filter(a => a.unlocked).slice(-1)[0];
        if (newAch) setTimeout(() => UI.toast(`🏆 إنجاز: ${newAch.title}`, 'success', 4000), 400);
      });

      btnUndo.addEventListener('click', async () => {
        const ok = await UI.confirm({
          title: 'إلغاء الإكمال',
          message: 'هل تريد إلغاء إكمال هذا الدرس؟',
          okText: 'نعم، ألغِ الإكمال',
          cancelText: 'تراجع',
          danger: true
        });
        if (!ok) return;
        Progress.resetLesson(lesson.lesson_id);
        UI.toast('تم إلغاء الإكمال', 'warning');
        render();
      });

      /* ---------- التنقل ---------- */
      const prev = Curriculum.getPrevLesson(lesson.lesson_id);
      const next = Curriculum.getNextLesson(lesson.lesson_id);

      const btnPrev = UI.el('#btnPrev');
      const btnNext = UI.el('#btnNext');

      if (!prev) btnPrev.disabled = true;
      else btnPrev.addEventListener('click', () =>
        location.href = `lesson.html?id=${encodeURIComponent(prev.lesson_id)}`);

      if (!next) btnNext.disabled = true;
      else btnNext.addEventListener('click', () =>
        location.href = `lesson.html?id=${encodeURIComponent(next.lesson_id)}`);

      render();
    })();
  </script>
</body>
</html>
