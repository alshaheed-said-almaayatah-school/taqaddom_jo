<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>تسجيل الدخول — منصة تقدّم</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="brand">
        <span class="brand-logo">ت</span>
        <span>
          منصة تقدّم
          <small>مجتمع جيل 2011</small>
        </span>
      </a>
      <button class="icon-btn" data-theme-toggle title="تبديل الوضع">🌙</button>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <div class="auth-tabs">
        <button id="tabLogin" class="active">تسجيل الدخول</button>
        <button id="tabRegister">إنشاء حساب</button>
      </div>

      <!-- Login form -->
      <form id="formLogin" autocomplete="on">
        <div class="field">
          <label for="loginEmail">البريد الإلكتروني</label>
          <input type="email" id="loginEmail" required placeholder="name@example.com" />
        </div>
        <div class="field">
          <label for="loginPass">كلمة المرور</label>
          <input type="password" id="loginPass" required placeholder="••••••" />
        </div>
        <div class="error" id="loginError"></div>
        <button type="submit" class="btn primary block mt-2">دخول</button>
      </form>

      <!-- Register form -->
      <form id="formRegister" autocomplete="on" class="hidden">
        <div class="field">
          <label for="regName">الاسم</label>
          <input type="text" id="regName" required placeholder="اسمك الكامل" />
        </div>
        <div class="field">
          <label for="regEmail">البريد الإلكتروني</label>
          <input type="email" id="regEmail" required placeholder="name@example.com" />
        </div>
        <div class="field">
          <label for="regPass">كلمة المرور</label>
          <input type="password" id="regPass" required placeholder="6 أحرف على الأقل" minlength="6" />
        </div>
        <div class="error" id="regError"></div>
        <button type="submit" class="btn primary block mt-2">إنشاء الحساب</button>
      </form>

      <p class="auth-foot">
        بياناتك تُحفظ محليًا على جهازك فقط في هذه النسخة.
      </p>
    </div>
  </main>

  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      const tabLogin    = UI.el('#tabLogin');
      const tabRegister = UI.el('#tabRegister');
      const formLogin   = UI.el('#formLogin');
      const formRegister= UI.el('#formRegister');

      const switchTo = (mode) => {
        const isLogin = mode === 'login';
        tabLogin.classList.toggle('active', isLogin);
        tabRegister.classList.toggle('active', !isLogin);
        formLogin.classList.toggle('hidden', !isLogin);
        formRegister.classList.toggle('hidden', isLogin);
        UI.el('#loginError').textContent = '';
        UI.el('#regError').textContent = '';
      };

      tabLogin.addEventListener('click', () => switchTo('login'));
      tabRegister.addEventListener('click', () => switchTo('register'));

      // إذا جاء المستخدم عبر ?mode=register
      const params = new URLSearchParams(location.search);
      if (params.get('mode') === 'register') switchTo('register');

      // إذا كان مسجّلًا دخول بالفعل → Dashboard
      if (Auth.currentUser()) location.replace('dashboard.html');

      formLogin.addEventListener('submit', (e) => {
        e.preventDefault();
        const res = Auth.login({
          email: UI.el('#loginEmail').value,
          password: UI.el('#loginPass').value
        });
        if (!res.ok) { UI.el('#loginError').textContent = res.error; return; }
        UI.toast('أهلاً بعودتك، ' + res.user.name + ' 👋', 'success');
        setTimeout(() => location.href = 'dashboard.html', 400);
      });

      formRegister.addEventListener('submit', (e) => {
        e.preventDefault();
        const res = Auth.register({
          name: UI.el('#regName').value,
          email: UI.el('#regEmail').value,
          password: UI.el('#regPass').value
        });
        if (!res.ok) { UI.el('#regError').textContent = res.error; return; }
        UI.toast('تم إنشاء حسابك بنجاح 🎉', 'success');
        setTimeout(() => location.href = 'dashboard.html', 500);
      });
    })();
  </script>
</body>
</html>
