<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1116" />
  <title>تسجيل الدخول | منصة تقدّم</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f8cff'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' dominant-baseline='middle' font-family='system-ui' font-weight='900' font-size='40' fill='white'%3E%D8%AA%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="brand">
        <span class="brand-logo">ت</span>
        <span>منصة تقدّم<small>مجتمع جيل 2011</small></span>
      </a>
      <button class="icon-btn" data-theme-toggle type="button" aria-label="تبديل الوضع">🌙</button>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">

      <div class="auth-tabs" role="tablist">
        <button id="tabLogin" type="button" class="active" role="tab">تسجيل الدخول</button>
        <button id="tabRegister" type="button" role="tab">إنشاء حساب</button>
      </div>

      <!-- تسجيل الدخول -->
      <form id="formLogin" autocomplete="on" novalidate>
        <div class="field">
          <label for="loginEmail">البريد الإلكتروني</label>
          <input type="email" id="loginEmail" autocomplete="email" placeholder="name@example.com" required />
        </div>
        <div class="field">
          <label for="loginPass">كلمة المرور</label>
          <input type="password" id="loginPass" autocomplete="current-password" placeholder="••••••" required />
        </div>
        <div class="error" id="loginError"></div>
        <button type="submit" class="btn primary block mt-2">دخول</button>
      </form>

      <!-- إنشاء حساب -->
      <form id="formRegister" autocomplete="on" novalidate class="hidden">
        <div class="field">
          <label for="regName">الاسم</label>
          <input type="text" id="regName" autocomplete="name" placeholder="اسمك الكامل" required />
        </div>
        <div class="field">
          <label for="regEmail">البريد الإلكتروني</label>
          <input type="email" id="regEmail" autocomplete="email" placeholder="name@example.com" required />
        </div>
        <div class="field">
          <label for="regPass">كلمة المرور</label>
          <input type="password" id="regPass" autocomplete="new-password" placeholder="6 أحرف على الأقل" minlength="6" required />
        </div>
        <div class="error" id="regError"></div>
        <button type="submit" class="btn primary block mt-2">إنشاء الحساب</button>
      </form>

      <p class="auth-foot">
        بياناتك تُحفظ محليًا على جهازك فقط.
      </p>
    </div>
  </main>

  <script src="data.js"></script>
  <script src="ui.js"></script>
  <script src="auth.js"></script>
  <script src="curriculum.js"></script>
  <script src="progress.js"></script>
  <script src="achievements.js"></script>
  <script src="search.js"></script>
  <script src="statistics.js"></script>
  <script src="focus.js"></script>
  <script src="app.js"></script>

  <script>
    (function () {
      const tabLogin     = document.getElementById('tabLogin');
      const tabRegister  = document.getElementById('tabRegister');
      const formLogin    = document.getElementById('formLogin');
      const formRegister = document.getElementById('formRegister');
      const errLogin     = document.getElementById('loginError');
      const errRegister  = document.getElementById('regError');

      const switchTo = (mode) => {
        const isLogin = mode === 'login';
        tabLogin.classList.toggle('active', isLogin);
        tabRegister.classList.toggle('active', !isLogin);
        formLogin.classList.toggle('hidden', !isLogin);
        formRegister.classList.toggle('hidden', isLogin);
        errLogin.textContent = '';
        errRegister.textContent = '';
      };

      tabLogin.addEventListener('click', () => switchTo('login'));
      tabRegister.addEventListener('click', () => switchTo('register'));

      const params = new URLSearchParams(location.search);
      if (params.get('mode') === 'register') switchTo('register');

      // إذا مسجّل دخول بالفعل → dashboard
      if (Auth.currentUser()) location.replace('dashboard.html');

      formLogin.addEventListener('submit', (e) => {
        e.preventDefault();
        errLogin.textContent = '';
        const res = Auth.login({
          email:    document.getElementById('loginEmail').value,
          password: document.getElementById('loginPass').value
        });
        if (!res.ok) { errLogin.textContent = res.error; return; }
        UI.toast('أهلاً بعودتك، ' + res.user.name + ' 👋', 'success');
        setTimeout(() => location.href = 'dashboard.html', 350);
      });

      formRegister.addEventListener('submit', (e) => {
        e.preventDefault();
        errRegister.textContent = '';
        const res = Auth.register({
          name:     document.getElementById('regName').value,
          email:    document.getElementById('regEmail').value,
          password: document.getElementById('regPass').value
        });
        if (!res.ok) { errRegister.textContent = res.error; return; }
        UI.toast('تم إنشاء حسابك بنجاح 🎉', 'success');
        setTimeout(() => location.href = 'dashboard.html', 450);
      });
    })();
  </script>
</body>
</html>
