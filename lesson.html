<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1116" />
  <title>الدرس | منصة تقدّم</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f8cff'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' dominant-baseline='middle' font-family='system-ui' font-weight='900' font-size='40' fill='white'%3E%D8%AA%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a href="dashboard.html" class="brand">
        <span class="brand-logo">ت</span>
        <span>الدرس<small id="headerCrumb">—</small></span>
      </a>
      <div class="row">
        <button class="icon-btn" data-theme-toggle type="button" aria-label="تبديل الوضع">🌙</button>
        <a href="profile.html" class="icon-btn" aria-label="حسابي">👤</a>
      </div>
    </div>
  </header>

  <main class="container section" id="lessonRoot">

    <div class="breadcrumb mb-2">
      <a href="subjects.html">المنهج</a>
      <span>›</span>
      <span id="crumbSubject">—</span>
      <span>›</span>
      <span id="crumbUnit">—</span>
    </div>

    <section class="card lesson-card mb-3">
      <div class="row-between wrap" style="gap:8px">
        <span class="badge" id="statusBadge">—</span>
        <span class="tiny" id="lessonMeta">—</span>
      </div>

      <h1 class="lesson-title" id="lessonTitle">—</h1>

      <div class="lesson-actions mt-3">
        <button class="btn ghost block" id="btnInProgress" type="button">◐ تحديد كـ منتصف الدرس</button>
        <button class="btn primary block" id="btnDone" type="button">✓ تم إنجاز الدرس</button>
        <button class="btn danger block hidden" id="btnUndo" type="button">↺ إلغاء الإكمال</button>
      </div>
    </section>

    <section class="lesson-nav">
      <button class="btn ghost" id="btnPrev" type="button">← الدرس السابق</button>
      <a href="subjects.html" class="btn ghost">📚 المنهج</a>
      <button class="btn ghost" id="btnNext" type="button">الدرس التالي →</button>
    </section>

  </main>

  <nav class="bottom-nav">
    <a href="dashboard.html"><span class="nav-ico">🏠</span>الرئيسية</a>
    <a href="subjects.html"><span class="nav-ico">📚</span>المنهج</a>
    <a href="statistics.html"><span class="nav-ico">📊</span>الإحصائيات</a>
    <a href="focus.html"><span class="nav-ico">🧠</span>تركيز</a>
    <a href="profile.html"><span class="nav-ico">👤</span>حسابي</a>
  </nav>

  <footer class="footer">منصة تقدّم © <span id="year"></span></footer>

  <script src="data.js"></script>
  <script src="ui.js"></script>
  <script src="auth.js"></script>
  <script src="curriculum.js"></script>
  <script src="progress.js"></script>
  <script src="achievements.js"></script>
  <script src="search.js"></script>
  <script src="statistics.js"></script>
  <script src="focus.js"></script>
  <script src="app.js"></script>

  <script>
    (function () {
      const user = Auth.requireAuth();
      if (!user) return;

      document.getElementById('year').textContent = new Date().getFullYear();

      const params   = new URLSearchParams(location.search);
      const lessonId = params.get('id');
      const lesson   = lessonId ? Curriculum.getLesson(lessonId) : null;

      /* ===== الدرس غير موجود ===== */
      if (!lesson) {
        document.getElementById('lessonRoot').innerHTML = `
          <div class="card center">
            <h2>لم يتم العثور على الدرس</h2>
            <p class="muted">تأكد أن الرابط يحتوي على معرّف درس صحيح.</p>
            <a href="subjects.html" class="btn primary mt-2">عودة إلى المنهج</a>
          </div>`;
        return;
      }

      document.title = `${lesson.lesson_name} | منصة تقدّم`;

      /* ===== تعبئة العناصر ===== */
      document.getElementById('headerCrumb').textContent  = lesson.subject_name;
      document.getElementById('crumbSubject').textContent = lesson.subject_name;
      document.getElementById('crumbUnit').textContent    = `الوحدة ${lesson.unit_number}: ${lesson.unit_name}`;
      document.getElementById('lessonTitle').textContent  = lesson.lesson_name;
      document.getElementById('lessonMeta').textContent   =
        `الدرس ${lesson.lesson_number} من الوحدة ${lesson.unit_number}`;

      /* ===== العناصر التفاعلية ===== */
      const badge    = document.getElementById('statusBadge');
      const btnDone  = document.getElementById('btnDone');
      const btnInp   = document.getElementById('btnInProgress');
      const btnUndo  = document.getElementById('btnUndo');

      const render = () => {
        const st = Progress.getStatus(lesson.lesson_id);

        badge.className = 'badge ' + (
          st === 'done'       ? 'success' :
          st === 'inprogress' ? 'warning' : ''
        );
        badge.textContent = Progress.STATUS_LABEL[st];

        btnDone.classList.toggle('hidden', st === 'done');
        btnInp.classList.toggle('hidden',  st === 'done' || st === 'inprogress');
        btnUndo.classList.toggle('hidden', st !== 'done');
      };

      /* ===== الأحداث ===== */
      btnInp.addEventListener('click', () => {
        Progress.markInProgress(lesson.lesson_id);
        UI.toast('تم وضع الدرس في منتصف الطريق ◐', 'info');
        render();
      });

      btnDone.addEventListener('click', async () => {
        const ok = await UI.confirm({
          title: 'تأكيد الإنجاز',
          message: 'هل أنت متأكد أنك أنجزت هذا الدرس؟',
          okText: 'نعم، أنجزته',
          cancelText: 'إلغاء'
        });
        if (!ok) return;

        const before = Achievements.list().filter(a => a.unlocked).length;
        Progress.markDone(lesson.lesson_id);
        UI.toast('تم إكمال الدرس ✓', 'success');
        render();

        const after = Achievements.list().filter(a => a.unlocked);
        if (after.length > before) {
          const newest = after[after.length - 1];
          setTimeout(() => UI.toast(`🏆 إنجاز: ${newest.title}`, 'success', 4000), 400);
        }
      });

      btnUndo.addEventListener('click', async () => {
        const ok = await UI.confirm({
          title: 'إلغاء الإكمال',
          message: 'هل تريد إلغاء إكمال هذا الدرس؟',
          okText: 'نعم، ألغِ الإكمال',
          cancelText: 'تراجع',
          danger: true
        });
        if (!ok) return;
        Progress.resetLesson(lesson.lesson_id);
        UI.toast('تم إلغاء الإكمال', 'warning');
        render();
      });

      /* ===== التنقل ===== */
      const prev = Curriculum.getPrevLesson(lesson.lesson_id);
      const next = Curriculum.getNextLesson(lesson.lesson_id);

      const btnPrev = document.getElementById('btnPrev');
      const btnNext = document.getElementById('btnNext');

      if (!prev) {
        btnPrev.disabled = true;
      } else {
        btnPrev.addEventListener('click', () =>
          location.href = `lesson.html?id=${encodeURIComponent(prev.lesson_id)}`);
      }

      if (!next) {
        btnNext.disabled = true;
      } else {
        btnNext.addEventListener('click', () =>
          location.href = `lesson.html?id=${encodeURIComponent(next.lesson_id)}`);
      }

      render();
    })();
  </script>
</body>
</html>
